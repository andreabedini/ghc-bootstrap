# phase4/series.conf -- the GHC 6.2.2 patch series, one concern per patch.
#
# Read by split-patch.py (via make-patch.sh). Three kinds of line:
#   patch NAME CLASS[,CLASS]   a patch, in series order, owning these hunk classes
#     text                     (two-space indent) its header, written before the diff
#   hunk FILE@LINE CLASS       manifest: the class of the hunk starting at pristine
#                              LINE of ghc/compiler/FILE, for hunks the heuristics in
#                              split-patch.py cannot recognise (or get wrong)
#
# Heuristic classes: WS SCC FFI SEMI DOT TC MON HIDE DUP ABS (see classify()).
# Every other class must be assigned here. A hunk with no class fails the build.

patch 0001-unlit-trailing-space WS
  GHC 6.2.2 -- mhs: trailing blanks after \begin{code} / \end{code}

  Bird-track and LaTeX-style literate Haskell is unlit'd before compilation.
  GHC's unlit accepts "\begin{code} " with trailing whitespace; MicroHs's
  unlit matches the marker exactly, so a code block whose delimiter carries
  a trailing blank or tab is silently not code and the module is empty or
  truncated. Same as 4.08.2's patch 0001. Whitespace-only change, 26 sites.

patch 0002-slit-boxed-string-literals SLIT
  GHC 6.2.2 -- mhs: SLIT/FSLIT over boxed String; Pretty's LitString path

  HsVersions.h defines SLIT(x) and FSLIT(x) as unboxed string literals
  ("..."#), a GHC-only syntax MicroHs does not lex; 2,000+ uses across the
  compiler. Redefined over the boxed String: FSLIT is a FastString either
  way and LitString is a FastString in the shim (build/shims-6.2.2-run1,
  utils/FastString). HsVersions.h also hides Semigroup's (<>) and (<$>) from
  the Prelude -- Pretty/Outputable/TcHsSyn define their own -- and imports
  GhcCompat (phase1/shims) for the handful of helpers the other patches use.
  utils/Pretty.lhs loses the Addr#-based LStr/ptext/hPutLitString fast path
  that only existed to serve the unboxed literals; ptext is now ftext.
  Same concern as 4.08.2's patch 0002 (DECISIONS.md D45).

patch 0003-machdeps-include-path INC
  GHC 6.2.2 -- mhs: #include "../includes/MachDeps.h" explicitly

  MicroHs puts its own runtime include directory first on cpphs's -I list,
  and that directory carries a MachDeps.h of its own. utils/Binary.hs and
  utils/FastMutInt.lhs `#include "MachDeps.h"` and got MicroHs's file
  instead of GHC's; the relative path picks the tree's.

patch 0004-binary-portable-serialisation BINARY
  GHC 6.2.2 -- mhs: utils/Binary.hs without ByteArray#, S#/J# and :%

  Binary (interface-file serialisation) was written against hslibs'
  MutableByteArray primitives (newCharArray, readWord8Array, hPutBufBAFull),
  GHC's Integer constructors S#/J# (a ByteArray# of limbs), the open Ratio
  constructor :% and the old closed IOError type. MicroHs has none of these.
  Data.Array.Byte in ST is the same abstraction; Integer is serialised as
  sign plus base-256 limbs; Ratio through numerator/denominator; the
  FastString dictionary entry is the interned String (the shim FastString
  has no ByteArray). Re-implemented rather than emulated (DECISIONS.md D20).
  Interface files written this way are read back by the same code, so the
  format only has to be self-consistent.

patch 0005-unique-portable-base62 BASE62
  GHC 6.2.2 -- mhs: iToBase62 without indexCharOffAddr#

  basicTypes/Unique.lhs indexed an unboxed string literal ("..."#) with
  indexCharOffAddr# to print uniques in base 62. MicroHs has neither the
  literal nor the primop; for a 62-element constant table the list index is
  equivalent. Same as 4.08.2's patch 0004 (there the table was a ByteArray).

patch 0006-uniqsupply-haskell-gensym GENSYM
  GHC 6.2.2 -- mhs: mk_supply# takes a parameter; genSym from GhcCompat

  mk_supply# in basicTypes/UniqSupply.lhs was a CAF of type IO UniqSupply.
  GHC's unsafeInterleaveIO re-executes the action on every run, so each node
  of the supply tree drew a fresh unique; MicroHs memoises the thunk, so the
  shared CAF was evaluated once and every Name in a module collided. Giving
  mk_supply# an (unused) depth parameter makes each recursive occurrence a
  distinct application, hence a distinct thunk, under either semantics.
  genSymZh was reached through `foreign import ccall "genSymZh" unsafe`
  (safety after the entity string, which mhs does not parse) and is a C
  counter; GhcCompat.genSym is the same counter in an IORef.
  4.08.2's patch 0010, verbatim.

patch 0007-unboxed-char-literals CHR
  GHC 6.2.2 -- mhs: unboxed character literals 'x'#

  basicTypes/OccName.lhs compares Char# values against '\xc0'# and friends.
  Unboxed character literals are GHC-only syntax; Char# = Char in the
  GlaExts shim, so the boxed literal denotes the same value. Same as 4.08.2's
  patch 0005; 6.2.2 has only these two lines left (the old lexer, which had
  22 more, was replaced by the alex one).

patch 0008-ctype-latin1-to-utf8 UTF8
  GHC 6.2.2 -- mhs: parser/Ctype.lhs comments transcoded Latin-1 -> UTF-8

  Ctype.lhs's character-class table has each Latin-1 character in a comment,
  as a raw Latin-1 byte. MicroHs reads source as UTF-8 and rejects the
  invalid sequences. The comments are transcoded; the code is unchanged
  (the characters themselves are written as '\161' escapes). Same as 4.08.2's
  patch 0008.

patch 0009-drop-scc-annotations SCC
  GHC 6.2.2 -- mhs: _scc_ cost-centre annotations dropped

  `_scc_ "name" expr` is GHC's profiling annotation syntax; MicroHs does not
  parse it, and with no profiling it is the identity anyway. Every
  occurrence in the compiler goes: HscMain, SimplCore, OccurAnal, CodeOutput,
  MkIface, StgLint, SimplStg, PprAbsC, Digraph, AsmCodeGen. Same as 4.08.2's
  patch 0009. Note: in HscMain several of these lines also began with the
  `;` that patch 0010 removes elsewhere; where the two coincide on one line
  the whole edit is here.

patch 0010-do-block-empty-statements SEMI
  GHC 6.2.2 -- mhs: no empty statement after `do {`

  GHC accepts `do { ; stmt ; ... }` -- an empty statement after the opening
  brace -- which Haskell 98 does not, and MicroHs rejects it. The leading
  semicolon is removed in HscMain, DsMeta, SimplCore, SysTools and the new
  TcArrows. Same class as 4.08.2's edits in HscMain.

patch 0011-trailing-and-double-commas TC
  GHC 6.2.2 -- mhs: trailing and doubled commas in lists

  MicroHs rejects a doubled comma (`, x, , y`, produced in 6.2.2 by
  CgHeapery's ",fetchAndReschedule" after a trailing comma and RnSource's
  dotnet names) and a trailing comma in a record declaration (HscTypes
  imp_home_names); the trailing commas in export lists (Literal, Module,
  HsTypes, HscMain, RdrHsSyn) were removed with the same edit. Two of the
  sites are inside comments (CprAnalyse, HscTypes) -- the substitution was
  made textually and the results are kept for byte fidelity.

patch 0012-duplicate-import-items DUP
  GHC 6.2.2 -- mhs: duplicate import items

  GHC tolerates an item listed twice in an import list (tyConDataCons,
  ModGuts, mkSubst, tcSplitSigmaTy, ...); MicroHs reports the second
  occurrence as "not exported" (DECISIONS.md D22). Eighteen files
  lose their duplicates. Same as 4.08.2's patches 0011, 0013, 0015. Three
  hunks in TcRnDriver and Desugar also fall under patch 0013 (the same
  import list needed both edits); they are here.

patch 0013-abstract-type-import-items ABS
  GHC 6.2.2 -- mhs: T(..) does not import an abstract type's field selectors

  Several modules export a type abstractly and its field selectors by name
  (HscTypes.IfaceDecls, TyCon.TyCon, Var.varType); GHC lets an importer's
  `T(..)` pick the selectors up, MicroHs does not, so they are named
  explicitly. Conversely where a module needs a type's constructors
  (ForeignCall, Type, MonoBinds) the import says `T(..)`. Two comment-only
  edits (Unique{-instance NamedThing-} in PprAbsC and RnIfaces) came from
  the same substitution and are kept for byte fidelity.

patch 0014-applicative-monad-instances MON
  GHC 6.2.2 -- mhs: Functor/Applicative/MonadFail instances

  Modern base makes Applicative a superclass of Monad and moves fail to
  MonadFail; MicroHs implements the modern hierarchy. Every monad the
  compiler defines with `instance Monad` (CgMonad FCode, DsMonad DsM,
  TcRnTypes TcRn, FlattenMonad Flatten, JavaGen LifterM, ByteCodeItbls
  State, the ilxGen test IIO) gets the two superclass instances, and its
  `fail` moves to MonadFail. In ByteCodeItbls the tuple pattern under >>=
  is taken apart with case, because mhs asks for MonadFail for a refutable
  lambda pattern. Same as 4.08.2's patch 0012.

patch 0015-space-around-composition-dot DOT
  GHC 6.2.2 -- mhs: `f.g` spaced to `f . g`

  MicroHs lexes `a.b` with no spaces as a record-dot field selection
  (OverloadedRecordDot), so a composition written `not.isTyVar` becomes
  "Cannot satisfy constraint: HasField". Every such composition is spaced.
  A few of the sites are in comments or in JavaGen's emitted Java text
  (`x_inst.x`); the textual substitution was applied uniformly and the
  results kept. Same as 4.08.2's patches 0014 and 0016.

patch 0016-hide-semigroup-op HIDE
  GHC 6.2.2 -- mhs: import Prelude hiding ((<>)) where HsVersions.h is not included

  Modern base's Prelude exports Semigroup's (<>). Modules that include
  HsVersions.h get the hiding import from patch 0002; coreSyn/
  PprExternalCore.lhs and javaGen/PrintJava.lhs use Pretty's (<>) without
  including it, so they hide the Prelude's themselves. Same as 4.08.2's
  patch 0018.

patch 0017-foreign-import-syntax FFI
  GHC 6.2.2 -- mhs: pre-FFI-addendum foreign declarations modernised

  The tree still carries the 1999 FFI syntax in places: `foreign import
  "name" unsafe f`, `foreign import ccall "name" unsafe f` (safety after
  the entity string), `foreign label`. MicroHs implements the Haskell 98 FFI
  addendum: calling convention first, safety before the entity string, and
  `foreign import ccall "&sym"` for a label. Rewritten in CompManager,
  ObjLink, DriverFlags, SysTools (its private rawSystem, active because we
  compile with __GLASGOW_HASKELL__=408), ByteCodeItbls (nine RTS entry
  labels) and eight ilxGen test programs. The C side is unchanged.

patch 0018-pprabsc-float-bit-casts FLOATCAST
  GHC 6.2.2 -- mhs: float/double bit casts without castSTUArray

  absCSyn/PprAbsC.lhs obtains the bit pattern of a Float or Double literal
  by writing it into an unboxed ST array and reading it back as Int
  (castSTUArray on GHC >= 504, MutableByteArray before). MicroHs has
  neither; GhcCompat.castFloatToInt / castDoubleToInts do the same bit cast
  through Data.Float/Data.Double. Same as 4.08.2's patch 0017.

patch 0019-simplmonad-portable-array-index ARRIDX
  GHC 6.2.2 -- mhs: switch table indexed with (!) instead of indexArray#

  simplCore/SimplMonad.lhs opened the Array constructor and used
  indexArray# with an unboxed-tuple result to skip bounds checking on the
  simplifier switch table. MicroHs has neither the constructor's GHC-specific
  shape nor the primop; the portable (!) is equivalent. Same as 4.08.2's
  patch 0003.

patch 0020-bytecodeitbls-ptr-to-int PTRINT
  GHC 6.2.2 -- mhs: ptrToInt via Foreign.Ptr.ptrToIntPtr

  ghci/ByteCodeItbls.lhs took a pointer's address by matching Ptr's
  constructor and applying addr2Int#. MicroHs's Ptr is abstract;
  Foreign.Ptr's ptrToIntPtr yields the same Int. (GHCi is not built; the
  module still has to compile in dependency order.)

patch 0021-panic-drop-typeable-instance TYPEABLE
  GHC 6.2.2 -- mhs: hand-written Typeable GhcException removed

  utils/Panic.lhs writes a Typeable instance by hand with the hslibs-era
  mkTyCon/mkAppTy. MicroHs derives Typeable for every data type, so the
  instance would be a duplicate; it goes.

patch 0022-fused-signature-bindings SIG
  GHC 6.2.2 -- mhs: `f :: T = e` split into signature and binding

  GHC accepted a type signature fused with its binding on one line
  (`getBaseDir :: IO (Maybe String) = do return Nothing`) or a signature
  directly followed by `= e` on the next line (HscMain initNameCache,
  PrelInfo ghcPrimExports, TcRnMonad getBannedProcLevels). Haskell 98 does
  not, and MicroHs rejects it; the binding gets its own left-hand side.

patch 0023-systools-ghc-version-guard CPPGUARD
  GHC 6.2.2 -- mhs: `#error GHC >= 5.00 is required` not for __MHS__

  main/SysTools.lhs (new in 6.2.2) has `#if __GLASGOW_HASKELL__ < 500 /
  #error`. We compile with -D__GLASGOW_HASKELL__=408 on purpose: HsVersions.h
  then maps GLAEXTS/DATA_BITS/... to the pre-hierarchical library names the
  shims provide (build/probe-ordered-622.sh). The guard is about real old
  GHCs, so it is disabled when cpphs's __MHS__ is defined.

patch 0024-tcsplice-non-ghci-stubs GHCISTUB
  GHC 6.2.2 -- mhs: TcSplice without GHCI: guard the import, stub tcBracket

  With GHCI undefined, typecheck/TcSplice.lhs is its #ifndef GHCI stubs, yet
  it still imports HscMain's compileExpr (not exported in that
  configuration) and exports tcBracket (named in TcSplice.hi-boot) with no
  non-GHCI definition. GHC tolerated the dangling import and the undefined
  export; MicroHs reports both. The import is put under #ifdef GHCI and
  tcBracket gets a panic stub, as 6.0-run2 did.

patch 0025-srcloc-strict-fields SRCLOC
  GHC 6.2.2 -- mhs: strict line/column in SrcLoc

  advanceSrcLoc does `c +# 1#` per character. In GHC FastInt is Int#, so the
  field is strict for free; under the FastTypes shim it is a lazy Int, and
  alexGetChar's `seq` forces only the constructor, so one (+1) thunk per
  character accumulates in the column until something forces it. Lines past
  ~50K columns overflowed the mhs stack. Bang annotations restore the
  strictness the original relied on (build/lexer622/FINDINGS.md "Overlay").

# ---- manifest: hunks the heuristics do not classify -----------------------
patch 0026-runtime-wraps-and-driver-exit RUNTIME
  GHC 6.2.2 -- mhs: arithmetic that must wrap, hFileSize, and exitWith

  Found by running the linked compiler (DECISIONS.md D47), not by
  typechecking. MicroHs traps where GHC wraps: fromInteger into
  Int8/Int16/Int32 is checked (utils/Binary.hs's Integer sign byte,
  basicTypes/Literal.lhs's narrow*Lit), and negate/abs of minBound raise
  (coreSyn/CoreUtils.lhs's hashExpr). utils/Binary.hs's readBinMem needs a
  file size and MicroHs handles have no hFileSize, so it reads the file
  whole by path. main/DriverUtil.hs: with __GLASGOW_HASKELL__=408 the driver
  takes its pre-5.01 catch-all branch, which swallows the ExitException
  that every clean exit throws; the >= 501 branch is taken under __MHS__ too.
  All under #if defined(__MHS__) or commented -- mhs.

